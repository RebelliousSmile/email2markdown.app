# Advisories tolerated by `cargo audit`, one reason each (reviewed 2026-10-30).
# None is a vulnerability: every entry is an unmaintained or unsound notice on a
# transitive dependency that no semver-compatible update removes. Drop an entry
# as soon as its origin upgrades.
[advisories]
ignore = [
    # fxhash, unmaintained: wry 0.44 -> kuchikiki -> selectors, compiled only for
    # Android (wry's cfg(target_os = "android")); never in a shipped binary.
    "RUSTSEC-2025-0057",
    # instant, unmaintained: tao 0.30 (tray only).
    "RUSTSEC-2024-0384",
    # proc-macro-error, unmaintained: gtk-rs 0.18 macros (tray, Linux only, build time).
    "RUSTSEC-2024-0370",
    # unsafe-libyaml, unmaintained: serde_yaml 0.9, deprecated; replacing it is a
    # format migration of every YAML file, out of scope here.
    "RUSTSEC-2024-0449",
    # glib, unsound VariantStrIter: tray-icon 0.19 -> libappindicator -> gtk 0.18
    # (Linux only); the app never iterates a glib Variant.
    "RUSTSEC-2024-0429",
    # rand 0.7.3, unsound with a custom logger: wry 0.44 -> kuchikiki -> selectors
    # -> phf_codegen, compiled only for Android (build script); 0.7 has no fixed
    # release. cargo audit ignores this ID for every rand version: on each
    # Cargo.lock update, check that rand 0.8 / 0.9 are at their fixed releases.
    "RUSTSEC-2026-0097",
]
