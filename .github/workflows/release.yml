name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x86_64
            artifact: windows-x86_64
          - os: macos-latest
            label: macOS native
            artifact: macos-native
          - os: ubuntu-24.04
            label: Linux x86_64
            artifact: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.93.0" # same as rust-toolchain.toml
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo build --locked --release --features tray
      - name: Name Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item target\release\email-to-markdown.exe "email-to-markdown-${{ github.ref_name }}-${{ matrix.artifact }}.exe"
      - name: Name Unix artifact
        if: runner.os != 'Windows'
        run: cp target/release/email-to-markdown "email-to-markdown-${{ github.ref_name }}-${{ matrix.artifact }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: email-to-markdown-${{ github.ref_name }}-*

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true
      # Read by the updater to verify the binary it downloads.
      - name: Generate SHA256SUMS
        working-directory: release-assets
        run: sha256sum email-to-markdown-* > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release-assets/*
          generate_release_notes: false
