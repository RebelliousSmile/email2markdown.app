name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_gmail_destructive:
        description: Run the protected dedicated Gmail destructive fixture
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  portable:
    name: ${{ matrix.os }} — core and GUI
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.93.0" # same as rust-toolchain.toml
          components: clippy
      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo check --locked
      - run: cargo check --locked --features tray
      - run: cargo clippy --locked --all-targets --features tray
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --all-targets --features tray
      - run: cargo build --locked --features tray

  audit:
    name: Ubuntu — security advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.93.0" # same as rust-toolchain.toml
      - run: cargo install cargo-audit --locked --version 0.22.2
      # Fails on a vulnerability. Unmaintained/unsound notices are reported as
      # warnings; the ones open on 2026-10-12 are all transitive (fxhash, instant,
      # proc-macro-error, event-listener, glib, rand) and were left open.
      - run: cargo audit

  tools:
    name: Ubuntu — Python tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r tools/requirements.txt
      # Always pass the test directory: collecting from the repository root
      # walks target/ and every other directory, which takes minutes.
      - run: .venv/bin/python -m pytest tools/tests

  dovecot:
    name: Ubuntu — destructive Dovecot fixture
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.93.0" # same as rust-toolchain.toml
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Start pinned fixture
        run: docker compose -f tests/fixtures/imap/compose.yaml up -d --wait
      - name: Run selected ignored IMAP test
        env:
          EMAIL_TO_MARKDOWN_IMAP_TEST: "1"
        run: cargo test --locked --test imap_integration contextual_search_uses_uidvalidity_and_keeps_messages_unseen -- --ignored --nocapture
      - name: Destroy fixture
        if: always()
        run: docker compose -f tests/fixtures/imap/compose.yaml down -v

  gmail-destructive:
    name: Protected Gmail destructive fixture
    if: github.event_name == 'workflow_dispatch' && inputs.run_gmail_destructive
    runs-on: ubuntu-24.04
    environment: gmail-destructive
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.93.0" # same as rust-toolchain.toml
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Run the explicitly gated Gmail test
        env:
          EMAIL_TO_MARKDOWN_GMAIL_DESTRUCTIVE_TEST: "1"
          EMAIL_TO_MARKDOWN_GMAIL_USER: ${{ secrets.EMAIL_TO_MARKDOWN_GMAIL_USER }}
          EMAIL_TO_MARKDOWN_GMAIL_PASSWORD: ${{ secrets.EMAIL_TO_MARKDOWN_GMAIL_PASSWORD }}
          EMAIL_TO_MARKDOWN_GMAIL_FIXTURE_ADDRESS: ${{ secrets.EMAIL_TO_MARKDOWN_GMAIL_FIXTURE_ADDRESS }}
        run: cargo test --locked --test imap_integration gmail_targeted_deletion_fixture -- --ignored --nocapture
