<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Export contextuel</title>
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    background: #f5f5f5;
    color: #222;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    background: #1e88e5;
    color: #fff;
    padding: 10px 16px;
    font-size: 15px;
    font-weight: 600;
    flex-shrink: 0;
  }
  header .target-path { display:block; font-size:11px; font-weight:400; font-family:ui-monospace,monospace; opacity:.9; margin-top:2px; overflow-wrap:anywhere; }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: #fff;
    border-bottom: 1px solid #ddd;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .toolbar label { display:flex; align-items:center; gap:6px; font-weight:600; }
  select,input,button { font:inherit; }
  .toolbar select, .toolbar button, .toolbar input[type="search"] {
    padding:5px 8px; border:1px solid #ccc; border-radius:4px; background:#fff; color:inherit; cursor:pointer; font-size:13px;
  }
  .toolbar input[type="search"] { cursor:text; }
  .toolbar button.primary { background:#1e88e5; color:#fff; border-color:#1e88e5; }
  .toolbar button.primary:hover { background:#1565c0; }
  .toolbar button:disabled { opacity:.5; cursor:not-allowed; }
  :focus-visible { outline:3px solid #f2a900; outline-offset:1px; }

  .rules-bar .rules-label { font-weight:600; white-space:nowrap; }
  .rules-list { display:flex; flex-wrap:wrap; gap:5px; align-items:center; max-height:52px; overflow-y:auto; flex:1; }
  .badge-rule { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; background:#7b1fa2; color:#fff; }
  .rules-list:empty::before { content:'aucune'; color:#888; font-style:italic; font-size:12px; }

  .table-wrap { flex:1; overflow-y:auto; padding:0; min-height:0; }
  table { width:100%; border-collapse:collapse; background:#fff; table-layout:fixed; }
  thead th { position:sticky; top:0; background:#eee; font-weight:600; padding:7px 8px; text-align:left; border-bottom:1px solid #ccc; white-space:nowrap; z-index:1; }
  tbody tr:nth-child(even) { background:#fafafa; }
  tbody tr:hover { background:#e3f2fd; }
  tbody td { padding:5px 8px; border-bottom:1px solid #eee; vertical-align:middle; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; position:relative; }
  th:first-child,td:first-child { width:36px; text-align:center; }
  th:nth-child(2) { width:130px; } th:nth-child(3) { width:220px; } th:nth-child(5) { width:120px; }
  th:nth-child(6),td:nth-child(6) { width:90px; text-align:center; overflow:visible; }
  .badge { display:inline-block; margin-left:6px; padding:1px 6px; border-radius:10px; font-size:11px; font-weight:600; background:#9e9e9e; color:#fff; vertical-align:middle; }

  .btn-create-rule { font-size:11px; color:#6a1b9a; cursor:pointer; border:1px solid #ce93d8; border-radius:3px; background:#f3e5f5; padding:2px 6px; line-height:1.4; }
  .btn-create-rule:hover { background:#e1bee7; border-color:#9c27b0; }
  .rule-form { display:none; position:absolute; top:100%; right:0; margin-top:2px; padding:6px 8px; border:1px solid #ce93d8; border-radius:4px; background:#fce4ec; gap:6px; align-items:center; flex-wrap:nowrap; z-index:2; box-shadow:0 2px 8px rgba(0,0,0,.2); white-space:nowrap; }
  .rule-form.open { display:flex; }
  .rule-form select { font-size:12px; padding:2px 4px; border:1px solid #ccc; border-radius:3px; background:#fff; max-width:220px; }
  .rule-form .btn-rule-submit { font-size:11px; padding:2px 8px; border:1px solid #4caf50; border-radius:3px; background:#4caf50; color:#fff; cursor:pointer; }
  .rule-form .btn-rule-submit:hover { background:#388e3c; }
  .rule-form .btn-rule-cancel { font-size:11px; padding:2px 6px; border:1px solid #ccc; border-radius:3px; background:#fff; cursor:pointer; }
  .rule-form .btn-rule-cancel:hover { background:#eee; }

  .status-bar { padding:8px 16px; background:#fff; border-top:1px solid #ddd; display:flex; align-items:center; gap:12px; flex-shrink:0; flex-wrap:wrap; }
  .status { font-weight:600; flex:1; }
  .status.busy { color:#1e88e5; }
  .status.busy::before { content:''; display:inline-block; width:9px; height:9px; margin-right:8px; border-radius:50%; background:#1e88e5; animation:pulse 1s ease-in-out infinite; vertical-align:middle; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.25; } }
  .error { color:#c62828; font-weight:600; }
  .warning { color:#7a4c00; background:#fff1cc; padding:6px 10px; border-radius:4px; font-size:12px; }

  .footer { padding:10px 16px; background:#fff; border-top:1px solid #ddd; display:flex; justify-content:flex-end; gap:8px; flex-shrink:0; }
  .footer button { padding:7px 20px; border:1px solid #ccc; border-radius:4px; cursor:pointer; font-size:13px; font-weight:600; background:#fff; color:inherit; }
  .footer button.primary { background:#1e88e5; color:#fff; border-color:#1e88e5; }
  .footer button.primary:hover { background:#1565c0; }
  .footer button:disabled { opacity:.5; cursor:not-allowed; }

  #load-more { display:block; margin:8px auto; }

  @media (prefers-color-scheme:dark) {
    body { background:#181a1e; color:#eceff4; }
    header { background:#155a9c; }
    .toolbar, .status-bar, .footer, table { background:#25282e; }
    .toolbar,.status-bar,.footer { border-color:#414650; }
    thead th { background:#30343c; color:#eceff4; }
    tbody tr:nth-child(even) { background:#2b2e35; }
    tbody tr:hover { background:#31445c; }
    tbody td, thead th { border-color:#414650; }
    .toolbar select,.toolbar input,.footer button { background:#30343c; border-color:#606875; color:#eceff4; }
  }
</style>
</head>
<body>
<header>
  Export contextuel
  <span class="target-path" id="target"></span>
</header>

<div class="toolbar">
  <label>Boîte aux lettres
    <select id="account" required aria-required="true"><option value="">Choisir…</option></select>
  </label>
  <button id="search" class="primary" disabled>Rechercher</button>
  <button id="config" hidden>Ouvrir la configuration</button>
</div>

<div class="toolbar rules-bar">
  <span class="rules-label">Règles associées :</span>
  <div id="rules" class="rules-list"></div>
</div>

<div class="toolbar">
  <button id="select-visible" disabled>Tout sélectionner</button>
  <button id="clear" disabled>Tout effacer</button>
  <input id="filter" type="search" placeholder="Filtrer la liste" aria-label="Filtrer la liste" autocomplete="off" disabled style="margin-left:auto;min-width:220px;">
</div>

<div class="table-wrap" tabindex="0" aria-label="Résultats de la recherche">
  <table>
    <thead><tr><th>Sél.</th><th>Date</th><th>Correspondant</th><th>Objet</th><th>Dossier</th><th>Règle</th></tr></thead>
    <tbody id="rows"><tr><td colspan="6">Choisissez une boîte puis lancez la recherche.</td></tr></tbody>
  </table>
</div>
<button id="load-more" hidden>Afficher 200 résultats supplémentaires</button>

<div class="status-bar">
  <div id="summary" class="status" aria-live="polite">Aucun message sélectionné.</div>
  <div id="warning" aria-live="assertive"></div>
  <div id="partial" hidden></div>
</div>

<div class="footer">
  <button id="cancel">Annuler</button>
  <button id="convert" class="primary" disabled>Convertir</button>
</div>

<script>
(() => {
  'use strict';
  const launch = window.__CONTEXTUAL_LAUNCH__ || {target:'',accounts:[],rule_labels:[]};
  const $ = id => document.getElementById(id);
  const state = { rows:[], filtered:[], selected:new Set(), shown:200, busy:false, preflight:null, retryConversion:[] };
  const ipc = payload => window.ipc.postMessage(JSON.stringify(payload));
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  $('target').textContent = launch.target;
  function renderRules() {
    $('rules').innerHTML = (launch.rule_labels || []).map(l => `<span class="badge-rule" title="${esc(l)}">${esc(l)}</span>`).join('');
  }
  renderRules();
  for (const account of launch.accounts) {
    const option = document.createElement('option'); option.value=account.name;
    option.textContent = account.name + (account.password_missing ? ' — mot de passe manquant' : '');
    option.dataset.delete = String(account.delete_after_export); option.dataset.missing=String(account.password_missing);
    $('account').append(option);
  }
  if (!launch.accounts.length) {
    $('rows').innerHTML='<tr><td colspan="6">Aucune boîte configurée.</td></tr>';
    $('config').hidden=false;
  }
  const accountOption = () => $('account').selectedOptions[0];
  function setBusy(value, message='') {
    state.busy=value; $('search').disabled=value || !$('account').value || accountOption()?.dataset.missing==='true';
    $('convert').disabled=value || state.selected.size===0 || (state.preflight && !state.preflight.supported);
    $('summary').classList.toggle('busy', value);
    if (message) $('summary').textContent=message;
  }
  function updateSummary() {
    const n=state.selected.size; const destructive=accountOption()?.dataset.delete==='true';
    $('summary').textContent=n ? `${n} message${n>1?'s':''} sélectionné${n>1?'s':''}${destructive?' — suppression ciblée du serveur après conversion':''}.` : 'Aucun message sélectionné.';
    $('convert').textContent = n && [...state.selected].some(key => state.rows.find(r=>r.key===key)?.already_present) ? 'Convertir / supprimer' : 'Convertir';
    $('convert').disabled=state.busy || n===0 || (state.preflight && !state.preflight.supported);
    $('clear').disabled=n===0;
  }
  function applyFilter() {
    const q=$('filter').value.trim().toLocaleLowerCase();
    state.filtered=state.rows.filter(row => !q || `${row.date||''} ${row.correspondent} ${row.subject} ${row.folder}`.toLocaleLowerCase().includes(q));
    state.shown=200; render();
  }
  function mountRuleButton(cell, row) {
    const domain = (row.sender_email.split('@')[1] || '').toLowerCase();
    const btn = document.createElement('button'); btn.type='button'; btn.className='btn-create-rule'; btn.textContent='+ règle';
    const form = document.createElement('div'); form.className='rule-form';
    const sel = document.createElement('select');
    const optFrom = document.createElement('option'); optFrom.value='from'; optFrom.textContent='adresse : '+row.sender_email; sel.appendChild(optFrom);
    if (domain) { const optDomain = document.createElement('option'); optDomain.value='domain'; optDomain.textContent='domaine : '+domain; sel.appendChild(optDomain); }
    const submitBtn = document.createElement('button'); submitBtn.type='button'; submitBtn.className='btn-rule-submit'; submitBtn.textContent='Créer';
    const cancelBtn = document.createElement('button'); cancelBtn.type='button'; cancelBtn.className='btn-rule-cancel'; cancelBtn.textContent='×';
    form.append(sel, submitBtn, cancelBtn);
    cell.append(btn, form);
    btn.addEventListener('click', () => form.classList.toggle('open'));
    cancelBtn.addEventListener('click', () => form.classList.remove('open'));
    submitBtn.addEventListener('click', () => {
      const kind = sel.value;
      const value = kind === 'domain' ? domain : row.sender_email;
      if (!value) return;
      const label = kind === 'domain' ? `le domaine ${value}` : `l'expéditeur ${value}`;
      if (!confirm(`Ajouter une règle de tri sur ${label} pour ce dossier ?`)) return;
      form.classList.remove('open');
      ipc({action:'create_rule', attr_kind:kind, attr_value:value});
    });
  }
  function render() {
    const visible=state.filtered.slice(0,state.shown);
    $('rows').innerHTML=visible.length ? visible.map(row => `<tr data-key="${esc(row.key)}">
      <td><input type="checkbox" aria-label="Sélectionner ${esc(row.subject)}" data-key="${esc(row.key)}" ${state.selected.has(row.key)?'checked':''}></td>
      <td>${esc(row.date ? new Date(row.date).toLocaleString() : '')}</td><td title="${esc(row.correspondent)}">${esc(row.correspondent)}</td>
      <td title="${esc(row.subject)}">${esc(row.subject)}${row.already_present?'<span class="badge">déjà converti</span>':''}</td><td title="${esc(row.folder)}">${esc(row.folder)}</td>
      <td class="rule-cell"></td></tr>`).join('')
      : '<tr><td colspan="6">Aucun message correspondant.</td></tr>';
    $('rows').querySelectorAll('input[data-key]').forEach(box => box.addEventListener('change', () => { box.checked ? state.selected.add(box.dataset.key) : state.selected.delete(box.dataset.key); updateSummary(); }));
    $('rows').querySelectorAll('tr[data-key]').forEach(tr => {
      const row = state.rows.find(r => r.key === tr.dataset.key);
      const cell = tr.querySelector('.rule-cell');
      if (row && row.sender_email && cell) mountRuleButton(cell, row);
    });
    $('load-more').hidden=state.shown>=state.filtered.length;
    $('select-visible').disabled=!state.filtered.length || state.busy;
    updateSummary();
  }
  $('account').addEventListener('change', () => {
    const missing=accountOption()?.dataset.missing==='true'; $('config').hidden=!missing;
    $('search').disabled=!$('account').value || missing || state.busy;
    $('warning').innerHTML=accountOption()?.dataset.delete==='true' ? '<div class="warning">Suppression serveur après écriture locale confirmée.</div>' : '';
  });
  $('search').addEventListener('click', () => { state.selected.clear(); state.preflight=null; setBusy(true,'Recherche en cours…'); ipc({action:'search',account:$('account').value}); });
  $('filter').addEventListener('input', applyFilter);
  $('select-visible').addEventListener('click', () => { state.filtered.forEach(row=>state.selected.add(row.key)); render(); });
  $('clear').addEventListener('click', () => { state.selected.clear(); render(); });
  $('load-more').addEventListener('click', () => { state.shown+=200; render(); });
  $('cancel').addEventListener('click', () => ipc({action:'cancel'}));
  $('config').addEventListener('click', () => ipc({action:'open_config'}));
  $('convert').addEventListener('click', () => {
    const keys=[...state.selected]; const destructive=accountOption()?.dataset.delete==='true';
    if (!keys.length || !confirm(`${keys.length} message(s) seront convertis${destructive?' puis supprimés du serveur':''}. Continuer ?`)) return;
    setBusy(true,'Conversion en cours…'); ipc({action:'convert',keys});
  });
  window.contextual_search_done = payload => {
    state.rows=payload.rows||[]; state.filtered=state.rows.slice(); state.selected.clear(); state.shown=200; state.preflight=payload.preflight; setBusy(false);
    $('filter').disabled=false; $('select-visible').disabled=!state.rows.length;
    if (!state.rows.length) $('summary').textContent='Aucun message trouvé.';
    if (payload.preflight.required && !payload.preflight.supported) $('warning').innerHTML=`<div class="warning">Suppression bloquée : ${esc(payload.preflight.reason||'serveur incompatible')}</div>`;
    render();
  };
  window.contextual_batch_partial = summary => {
    setBusy(false); state.retryConversion=summary.retry_conversion||[]; $('partial').hidden=false;
    $('partial').innerHTML=`<p class="error">${esc(summary.message)}</p>${summary.stale_search?'<button id="refresh-now">Relancer toute la recherche</button>':''}${state.retryConversion.length?'<button id="retry-conversion">Réessayer les conversions</button>':''}${summary.retry_deletion_count?'<button id="retry-deletion">Réessayer les suppressions</button>':''}`;
    $('refresh-now')?.addEventListener('click',()=> $('search').click());
    $('retry-conversion')?.addEventListener('click',()=>{ setBusy(true,'Nouvelle tentative de conversion…'); ipc({action:'convert',keys:state.retryConversion}); });
    $('retry-deletion')?.addEventListener('click',()=>{ setBusy(true,'Nouvelle tentative de suppression…'); ipc({action:'retry_deletion'}); });
  };
  window.contextual_error = (kind,message) => { setBusy(false); $('summary').innerHTML=`<span class="error">${esc(message)}</span>`; if (/password|configuration/i.test(message)) $('config').hidden=false; };
  window.contextual_rules_updated = labels => { launch.rule_labels = labels || []; renderRules(); };
})();
</script>
</body>
</html>
