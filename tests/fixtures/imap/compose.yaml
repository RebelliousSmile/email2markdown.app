services:
  seed:
    image: docker.io/dovecot/dovecot:2.3.21.1@sha256:547d28f9a893c93a1d2f6dc164880cd7bfa74009106dfa46b36a6a2ee636d921
    command:
      - /bin/sh
      - -ec
      - |
        # One mailbox per test: contextual search walks every folder of an
        # account, so tests sharing a user would see each other's deletions.
        for user in contextual purge clean-accepted clean-refused clean-stale clean-absent clean-missing batch export-purge export-batch; do
          mkdir -p /srv/mail/$$user/Maildir/cur /srv/mail/$$user/Maildir/new /srv/mail/$$user/Maildir/tmp
          cp /seed/*.eml /srv/mail/$$user/Maildir/new/
        done
        # Enough messages to cross a body fetch batch (BODY_FETCH_BATCH = 10).
        cp /seed/batch/*.eml /srv/mail/export-batch/Maildir/new/
        chmod -R a+rwX /srv/mail
    volumes:
      - mail:/srv/mail
      - ./seed:/seed:ro

  dovecot:
    image: docker.io/dovecot/dovecot:2.3.21.1@sha256:547d28f9a893c93a1d2f6dc164880cd7bfa74009106dfa46b36a6a2ee636d921
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "1993:993"
    volumes:
      - mail:/srv/mail
      - ./99-contextual-test.conf:/etc/dovecot/conf.d/99-contextual-test.conf:ro

volumes:
  mail:
