services:
  seed:
    image: docker.io/dovecot/dovecot:2.3.21.1@sha256:547d28f9a893c93a1d2f6dc164880cd7bfa74009106dfa46b36a6a2ee636d921
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /srv/mail/test/Maildir/cur /srv/mail/test/Maildir/new /srv/mail/test/Maildir/tmp
        cp /seed/*.eml /srv/mail/test/Maildir/new/
        chmod -R a+rwX /srv/mail
    volumes:
      - mail:/srv/mail
      - ./seed:/seed:ro

  dovecot:
    image: docker.io/dovecot/dovecot:2.3.21.1@sha256:547d28f9a893c93a1d2f6dc164880cd7bfa74009106dfa46b36a6a2ee636d921
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "1993:993"
    volumes:
      - mail:/srv/mail
      - ./99-contextual-test.conf:/etc/dovecot/conf.d/99-contextual-test.conf:ro

volumes:
  mail:
